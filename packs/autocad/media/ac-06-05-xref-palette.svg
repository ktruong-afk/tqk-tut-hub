<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Quản lý tệp tham chiếu ngoài (External References - XREF)</text>

  <!-- Left: Palette UI simulation -->
  <g transform="translate(50, 90)">
    <rect width="360" height="260" fill="#21252b" stroke="#3e4451" stroke-width="1" rx="4"/>
    <rect width="360" height="30" fill="#2c313a" rx="4"/>
    <text x="15" y="20" fill="#abb2bf" font-family="sans-serif" font-size="12" font-weight="bold">External References Palette (XR)</text>

    <!-- Table header -->
    <rect x="10" y="38" width="340" height="22" fill="#1e222b"/>
    <text x="20" y="53" fill="#5c6370" font-family="sans-serif" font-size="10" font-weight="bold">Reference Name</text>
    <text x="170" y="53" fill="#5c6370" font-family="sans-serif" font-size="10" font-weight="bold">Status</text>
    <text x="240" y="53" fill="#5c6370" font-family="sans-serif" font-size="10" font-weight="bold">Type</text>
    <text x="290" y="53" fill="#5c6370" font-family="sans-serif" font-size="10" font-weight="bold">Size</text>

    <!-- Row 1: Current drawing -->
    <rect x="10" y="65" width="340" height="26" fill="#282c34"/>
    <text x="20" y="82" fill="#61afef" font-family="sans-serif" font-size="11">MB-Tang-1.dwg</text>
    <text x="170" y="82" fill="#98c379" font-family="sans-serif" font-size="11">Opened</text>
    <text x="240" y="82" fill="#abb2bf" font-family="sans-serif" font-size="11">Current</text>
    <text x="290" y="82" fill="#abb2bf" font-family="sans-serif" font-size="11">1.2 MB</text>

    <!-- Row 2: Attached DWG -->
    <rect x="10" y="95" width="340" height="26" fill="#1e222b"/>
    <text x="20" y="112" fill="#ffffff" font-family="sans-serif" font-size="11">Lưới-Trục-KC.dwg</text>
    <text x="170" y="112" fill="#98c379" font-family="sans-serif" font-size="11">Loaded</text>
    <text x="240" y="112" fill="#e5c07b" font-family="sans-serif" font-size="11">Attach</text>
    <text x="290" y="112" fill="#abb2bf" font-family="sans-serif" font-size="11">450 KB</text>

    <!-- Row 3: Attached Image -->
    <rect x="10" y="125" width="340" height="26" fill="#282c34"/>
    <text x="20" y="142" fill="#ffffff" font-family="sans-serif" font-size="11">So-Do-Vi-Tri.png</text>
    <text x="170" y="142" fill="#98c379" font-family="sans-serif" font-size="11">Loaded</text>
    <text x="240" y="142" fill="#e5c07b" font-family="sans-serif" font-size="11">Image</text>
    <text x="290" y="142" fill="#abb2bf" font-family="sans-serif" font-size="11">820 KB</text>

    <!-- Row 4: Missing reference warning -->
    <rect x="10" y="155" width="340" height="26" fill="#1e222b"/>
    <text x="20" y="172" fill="#e06c75" font-family="sans-serif" font-size="11">Mat-Bang-MEP.dwg</text>
    <text x="170" y="172" fill="#e06c75" font-family="sans-serif" font-size="11">! Not Found</text>
    <text x="240" y="172" fill="#abb2bf" font-family="sans-serif" font-size="11">Overlay</text>
    <text x="290" y="172" fill="#5c6370" font-family="sans-serif" font-size="11">--</text>

    <text x="20" y="215" fill="#5c6370" font-family="sans-serif" font-size="10">Saved Path: .\KIENTRUC\Luoi-Truc-KC.dwg</text>
    <text x="20" y="235" fill="#98c379" font-family="sans-serif" font-size="10">Path Type: Relative (Đường dẫn tương đối)</text>
  </g>

  <!-- Right: Compare Attach vs Overlay -->
  <g transform="translate(440, 90)">
    <rect width="270" height="260" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="135" y="30" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Attach vs Overlay</text>

    <rect x="20" y="50" width="230" height="85" fill="#282c34" stroke="#61afef" stroke-width="1" rx="4"/>
    <text x="30" y="70" fill="#61afef" font-family="sans-serif" font-size="11" font-weight="bold">Kiểu Attachment:</text>
    <text x="30" y="90" fill="#abb2bf" font-family="sans-serif" font-size="10">• File lồng nhau (nested)</text>
    <text x="30" y="105" fill="#abb2bf" font-family="sans-serif" font-size="10">• Khi người khác xref file bạn,</text>
    <text x="30" y="120" fill="#abb2bf" font-family="sans-serif" font-size="10">  file con cũng đi theo.</text>

    <rect x="20" y="150" width="230" height="85" fill="#282c34" stroke="#98c379" stroke-width="1" rx="4"/>
    <text x="30" y="170" fill="#98c379" font-family="sans-serif" font-size="11" font-weight="bold">Kiểu Overlay (Khuyên dùng):</text>
    <text x="30" y="190" fill="#abb2bf" font-family="sans-serif" font-size="10">• Chỉ hiển thị ở bản vẽ hiện hành</text>
    <text x="30" y="205" fill="#abb2bf" font-family="sans-serif" font-size="10">• Tránh vòng lặp tham chiếu</text>
    <text x="30" y="220" fill="#abb2bf" font-family="sans-serif" font-size="10">• Tránh bản vẽ bị phình to</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">XREF giúp làm việc nhóm: Kiến trúc, Kết cấu, MEP vẽ đồng thời trên cùng nền bản vẽ</text>
</svg>
