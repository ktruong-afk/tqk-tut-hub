<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Cấu trúc giải phẫu một chương trình AutoLISP chuẩn</text>

  <!-- Lisp Code Block UI -->
  <g transform="translate(60, 85)">
    <rect width="640" height="280" fill="#1e222b" stroke="#3e4451" stroke-width="1.5" rx="6"/>
    <rect width="640" height="28" fill="#2c313a" rx="6"/>
    <circle cx="20" cy="14" r="5" fill="#e06c75"/>
    <circle cx="35" cy="14" r="5" fill="#e5c07b"/>
    <circle cx="50" cy="14" r="5" fill="#98c379"/>
    <text x="320" y="19" fill="#abb2bf" font-family="monospace" font-size="11" text-anchor="middle">ve-duong-tron.lsp</text>

    <!-- Code Lines -->
    <g transform="translate(25, 45)" font-family="monospace" font-size="13">
      <!-- Line 1: defun -->
      <text x="0" y="20">
        <tspan fill="#e5c07b">(</tspan><tspan fill="#c678dd">defun </tspan><tspan fill="#61afef">c:VETRON </tspan><tspan fill="#abb2bf">( / pt r )</tspan>
      </text>
      <!-- Line 2: prompt getpoint -->
      <text x="25" y="55">
        <tspan fill="#abb2bf">(setq pt (</tspan><tspan fill="#61afef">getpoint </tspan><tspan fill="#98c379">"\nChon tam hinh tron: "</tspan><tspan fill="#abb2bf">))</tspan>
      </text>
      <!-- Line 3: prompt getdist -->
      <text x="25" y="90">
        <tspan fill="#abb2bf">(setq r (</tspan><tspan fill="#61afef">getdist </tspan><tspan fill="#abb2bf">pt </tspan><tspan fill="#98c379">"\nNhap ban kinh: "</tspan><tspan fill="#abb2bf">))</tspan>
      </text>
      <!-- Line 4: command -->
      <text x="25" y="125">
        <tspan fill="#c678dd">(command </tspan><tspan fill="#98c379">"_.CIRCLE" </tspan><tspan fill="#abb2bf">pt r)</tspan>
      </text>
      <!-- Line 5: princ -->
      <text x="25" y="160">
        <tspan fill="#abb2bf">(princ </tspan><tspan fill="#98c379">"\nDa ve xong duong tron!"</tspan><tspan fill="#abb2bf">)</tspan>
      </text>
      <!-- Line 6: end -->
      <text x="25" y="195">
        <tspan fill="#abb2bf">(princ)</tspan>
      </text>
      <text x="0" y="225">
        <tspan fill="#e5c07b">)</tspan>
      </text>
    </g>

    <!-- Callout annotations -->
    <rect x="360" y="55" width="250" height="30" fill="#282c34" stroke="#61afef" rx="3"/>
    <text x="370" y="75" fill="#61afef" font-family="sans-serif" font-size="11">c:VETRON $\to$ Tạo lệnh gõ tắt VETRON</text>

    <rect x="360" y="100" width="250" height="30" fill="#282c34" stroke="#98c379" rx="3"/>
    <text x="370" y="120" fill="#98c379" font-family="sans-serif" font-size="11">( / pt r ) $\to$ Khai báo biến cục bộ an toàn</text>

    <rect x="360" y="145" width="250" height="30" fill="#282c34" stroke="#e5c07b" rx="3"/>
    <text x="370" y="165" fill="#e5c07b" font-family="sans-serif" font-size="11">command $\to$ Gọi lệnh vẽ CIRCLE của CAD</text>

    <rect x="360" y="190" width="250" height="30" fill="#282c34" stroke="#c678dd" rx="3"/>
    <text x="370" y="210" fill="#c678dd" font-family="sans-serif" font-size="11">(princ) $\to$ Kết thúc sạch sẽ, không hiện nil</text>
  </g>

  <text x="380" y="395" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Nạp tệp Lisp bằng lệnh APPLOAD $\to$ Gõ tên lệnh VETRON để chạy tự động</text>
</svg>
