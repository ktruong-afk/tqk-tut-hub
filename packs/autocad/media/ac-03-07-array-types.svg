<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- 1. Rectangular Array -->
  <g transform="translate(40, 50)">
    <rect width="210" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="105" y="30" fill="#61afef" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Rectangular (Lưới)</text>
    
    <!-- 3x3 grid of circles -->
    <g fill="#2d5e8a" stroke="#61afef" stroke-width="2">
      <circle cx="50" cy="80" r="14"/>
      <circle cx="105" cy="80" r="14"/>
      <circle cx="160" cy="80" r="14"/>
      <circle cx="50" cy="140" r="14"/>
      <circle cx="105" cy="140" r="14"/>
      <circle cx="160" cy="140" r="14"/>
      <circle cx="50" cy="200" r="14"/>
      <circle cx="105" cy="200" r="14"/>
      <circle cx="160" cy="200" r="14"/>
    </g>
    <text x="105" y="260" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Theo Hàng (Rows)</text>
    <text x="105" y="280" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">và Cột (Columns)</text>
  </g>

  <!-- 2. Polar Array -->
  <g transform="translate(275, 50)">
    <rect width="210" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="105" y="30" fill="#98c379" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Polar (Tròn xoay)</text>

    <!-- Center point -->
    <circle cx="105" cy="145" r="4" fill="#e06c75"/>
    <circle cx="105" cy="145" r="55" stroke="#4c566a" stroke-width="1" stroke-dasharray="4,4" fill="none"/>
    
    <!-- 6 circles rotated around center -->
    <g fill="#387a38" stroke="#98c379" stroke-width="2">
      <circle cx="160" cy="145" r="12"/>
      <circle cx="132" cy="192" r="12"/>
      <circle cx="77" cy="192" r="12"/>
      <circle cx="50" cy="145" r="12"/>
      <circle cx="77" cy="97" r="12"/>
      <circle cx="132" cy="97" r="12"/>
    </g>
    <text x="105" y="260" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Xoay quanh tâm</text>
    <text x="105" y="280" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Góc quét Fill Angle (360°)</text>
  </g>

  <!-- 3. Path Array -->
  <g transform="translate(510, 50)">
    <rect width="210" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="105" y="30" fill="#e5c07b" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Path (Theo đường dẫn)</text>

    <!-- Curved path -->
    <path d="M 30 220 Q 80 70, 180 140" stroke="#4c566a" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

    <!-- Shapes aligned to path -->
    <g fill="#7a6225" stroke="#e5c07b" stroke-width="1.5">
      <rect x="20" y="200" width="18" height="14" rx="2" transform="rotate(-65 29 207)"/>
      <rect x="50" y="145" width="18" height="14" rx="2" transform="rotate(-40 59 152)"/>
      <rect x="90" y="112" width="18" height="14" rx="2" transform="rotate(5 99 119)"/>
      <rect x="135" y="118" width="18" height="14" rx="2" transform="rotate(35 144 125)"/>
      <rect x="175" y="145" width="18" height="14" rx="2" transform="rotate(50 184 152)"/>
    </g>
    <text x="105" y="260" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Rải đều theo Polyline,</text>
    <text x="105" y="280" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Cung tròn hoặc Spline</text>
  </g>
</svg>
