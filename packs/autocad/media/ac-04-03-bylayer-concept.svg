<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Nguyên tắc thừa hưởng thuộc tính ByLayer</text>

  <!-- Parent: Layer Definition -->
  <g transform="translate(180, 80)">
    <rect width="400" height="90" fill="#242b35" stroke="#61afef" stroke-width="2" rx="6"/>
    <text x="200" y="30" fill="#61afef" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lớp: "NET-THAY" (Layer Definition)</text>
    <text x="200" y="55" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Color = White | Linetype = Continuous | Lineweight = 0.35 mm</text>
    <text x="200" y="75" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Nơi quy định duy nhất thuộc tính tập trung</text>
  </g>

  <!-- Inheritance arrows -->
  <g stroke="#e5c07b" stroke-width="2">
    <line x1="260" y1="170" x2="160" y2="240"/>
    <polygon points="160,240 165,230 174,236" fill="#e5c07b"/>

    <line x1="380" y1="170" x2="380" y2="240"/>
    <polygon points="380,240 375,230 385,230" fill="#e5c07b"/>

    <line x1="500" y1="170" x2="600" y2="240"/>
    <polygon points="600,240 586,236 595,230" fill="#e5c07b"/>
  </g>
  <text x="380" y="215" fill="#e5c07b" font-family="sans-serif" font-size="11" text-anchor="middle">Thừa hưởng ByLayer</text>

  <!-- Children: Objects with ByLayer -->
  <g transform="translate(60, 240)">
    <rect width="180" height="120" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <line x1="30" y1="40" x2="150" y2="40" stroke="#ffffff" stroke-width="3"/>
    <text x="90" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Đoạn thẳng Line</text>
    <text x="90" y="95" fill="#98c379" font-family="sans-serif" font-size="10" text-anchor="middle">Color = ByLayer</text>
    <text x="90" y="110" fill="#98c379" font-family="sans-serif" font-size="10" text-anchor="middle">Weight = ByLayer (0.35)</text>
  </g>

  <g transform="translate(290, 240)">
    <rect width="180" height="120" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <circle cx="90" cy="40" r="22" stroke="#ffffff" stroke-width="3" fill="none"/>
    <text x="90" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Đường tròn Circle</text>
    <text x="90" y="95" fill="#98c379" font-family="sans-serif" font-size="10" text-anchor="middle">Color = ByLayer</text>
    <text x="90" y="110" fill="#98c379" font-family="sans-serif" font-size="10" text-anchor="middle">Linetype = ByLayer</text>
  </g>

  <g transform="translate(520, 240)">
    <rect width="180" height="120" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <rect x="50" y="25" width="80" height="30" stroke="#ffffff" stroke-width="3" fill="none"/>
    <text x="90" y="75" fill="#ffffff" font-family="sans-serif" font-size="12" text-anchor="middle">Chữ nhật Rectangle</text>
    <text x="90" y="95" fill="#98c379" font-family="sans-serif" font-size="10" text-anchor="middle">Color = ByLayer</text>
    <text x="90" y="110" fill="#98c379" font-family="sans-serif" font-size="10" text-anchor="middle">Weight = ByLayer (0.35)</text>
  </g>

  <text x="380" y="400" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Không gán màu cứng cho từng đối tượng đơn lẻ — Luôn để ByLayer!</text>
</svg>
