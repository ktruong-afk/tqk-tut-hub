<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <pattern id="hatch-modpart" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#61afef" stroke-width="1.2" />
    </pattern>
  </defs>

  <rect width="760" height="460" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="420" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Chi tiết tay đòn cơ khí 2D (Tổng hợp các lệnh Modify)</text>

  <!-- Mechanical lever / arm shape created via FILLET, OFFSET, TRIM, MIRROR, ARRAY -->
  <!-- Left boss (Head) -->
  <circle cx="200" cy="240" r="60" stroke="#98c379" stroke-width="2.5" fill="none"/>
  <circle cx="200" cy="240" r="30" stroke="#61afef" stroke-width="2" fill="#14161a"/>

  <!-- Right boss (Tail) -->
  <circle cx="560" cy="240" r="45" stroke="#98c379" stroke-width="2.5" fill="none"/>
  <circle cx="560" cy="240" r="20" stroke="#61afef" stroke-width="2" fill="#14161a"/>

  <!-- Connecting neck with Fillet fillets -->
  <path d="M 235 190 L 525 205 A 40 40 0 0 0 525 275 L 235 290 A 60 60 0 0 0 235 190 Z" stroke="#98c379" stroke-width="2.5" fill="url(#hatch-modpart)"/>

  <!-- Center line -->
  <line x1="120" y1="240" x2="630" y2="240" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="10,4,2,4"/>
  <circle cx="200" cy="240" r="3" fill="#e06c75"/>
  <circle cx="560" cy="240" r="3" fill="#e06c75"/>

  <!-- Dimension references -->
  <text x="380" y="160" fill="#abb2bf" font-family="monospace" font-size="12" text-anchor="middle">Khoảng cách trục L = 360mm (OFFSET / MOVE)</text>
  <text x="380" y="340" fill="#abb2bf" font-family="monospace" font-size="12" text-anchor="middle">Bo tròn góc chuyển tiếp R40 (FILLET)</text>
  <text x="380" y="420" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Quy trình: OFFSET → TRIM → FILLET → MIRROR → HATCH</text>
</svg>
