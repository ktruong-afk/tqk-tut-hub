<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Dynamic Block: Tham số (Parameter) + Hành động (Action)</text>

  <!-- Section 1: Concept -->
  <g transform="translate(40, 90)">
    <rect width="210" height="260" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="105" y="30" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Linear + Stretch</text>

    <!-- Linear parameter visualization -->
    <rect x="25" y="60" width="160" height="40" fill="#282c34" stroke="#61afef" stroke-width="1.5"/>
    <line x1="25" y1="120" x2="185" y2="120" stroke="#98c379" stroke-width="2"/>
    <polygon points="185,115 195,120 185,125" fill="#98c379"/>
    <polygon points="25,115 15,120 25,125" fill="#98c379"/>
    <text x="105" y="140" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Distance1 (Linear)</text>

    <text x="105" y="180" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Kéo grip mũi tên để co giãn</text>
    <text x="105" y="200" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">chiều dài dầm / thép / bàn</text>
    <rect x="65" y="220" width="80" height="24" fill="#98c379" fill-opacity="0.2" stroke="#98c379" rx="3"/>
    <text x="105" y="236" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Action: Stretch</text>
  </g>

  <!-- Section 2: Flip -->
  <g transform="translate(275, 90)">
    <rect width="210" height="260" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="105" y="30" fill="#e5c07b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Flip Parameter</text>

    <!-- Door swing flip -->
    <line x1="30" y1="110" x2="180" y2="110" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="105,95 95,110 115,110" fill="#61afef"/>
    <polygon points="105,125 95,110 115,110" fill="#61afef"/>

    <text x="105" y="145" fill="#61afef" font-family="sans-serif" font-size="11" text-anchor="middle">Trục lật đối xứng (Flip)</text>
    <text x="105" y="180" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Bấm vào mũi tên lật để</text>
    <text x="105" y="200" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">đổi hướng mở cửa trái/phải</text>
    <rect x="65" y="220" width="80" height="24" fill="#e5c07b" fill-opacity="0.2" stroke="#e5c07b" rx="3"/>
    <text x="105" y="236" fill="#e5c07b" font-family="sans-serif" font-size="11" text-anchor="middle">Action: Flip</text>
  </g>

  <!-- Section 3: Visibility -->
  <g transform="translate(510, 90)">
    <rect width="210" height="260" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="105" y="30" fill="#c678dd" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Visibility States</text>

    <!-- Dropdown list look -->
    <rect x="25" y="65" width="160" height="30" fill="#282c34" stroke="#c678dd" stroke-width="1.5" rx="3"/>
    <text x="35" y="85" fill="#ffffff" font-family="sans-serif" font-size="11">Cửa 1 cánh 800 ▼</text>

    <text x="105" y="125" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">Các trạng thái hiển thị:</text>
    <text x="105" y="150" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">• Cửa 1 cánh (800mm)</text>
    <text x="105" y="170" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">• Cửa 2 cánh (1600mm)</text>
    <text x="105" y="190" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">• Cửa trượt lùa (1800mm)</text>

    <text x="105" y="236" fill="#c678dd" font-family="sans-serif" font-size="11" text-anchor="middle">1 Block thay 10 Block tĩnh</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Biên tập Dynamic Block trong môi trường Block Editor (BEDIT)</text>
</svg>
