<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Left: TRIM Operation -->
  <g transform="translate(60, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#e06c75" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh TRIM (Cắt tỉa)</text>

    <!-- Cutting boundary -->
    <line x1="140" y1="60" x2="140" y2="240" stroke="#61afef" stroke-width="3"/>
    <text x="140" y="260" fill="#61afef" font-family="sans-serif" font-size="11" text-anchor="middle">Đường dao cắt (Boundary)</text>

    <!-- Passing lines -->
    <line x1="40" y1="110" x2="140" y2="110" stroke="#98c379" stroke-width="2.5"/>
    <line x1="140" y1="110" x2="240" y2="110" stroke="#e06c75" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="190" cy="110" r="14" fill="#e06c75" fill-opacity="0.2" stroke="#e06c75" stroke-width="1"/>
    <text x="190" y="115" fill="#e06c75" font-family="sans-serif" font-size="16" text-anchor="middle">✕</text>
    <text x="190" y="140" fill="#e06c75" font-family="sans-serif" font-size="10" text-anchor="middle">Bấm xén bỏ</text>

    <line x1="40" y1="180" x2="140" y2="180" stroke="#98c379" stroke-width="2.5"/>
    <line x1="140" y1="180" x2="240" y2="180" stroke="#e06c75" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="140" y="295" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Xén sạch nét thừa giao cắt</text>
  </g>

  <!-- Right: EXTEND Operation -->
  <g transform="translate(400, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#98c379" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh EXTEND (Kéo dài)</text>

    <!-- Boundary line -->
    <line x1="220" y1="60" x2="220" y2="240" stroke="#61afef" stroke-width="3"/>
    <text x="220" y="260" fill="#61afef" font-family="sans-serif" font-size="11" text-anchor="middle">Đường biên chạm tới</text>

    <!-- Extending lines -->
    <line x1="40" y1="110" x2="130" y2="110" stroke="#abb2bf" stroke-width="2.5"/>
    <line x1="130" y1="110" x2="220" y2="110" stroke="#98c379" stroke-width="2.5" stroke-dasharray="5,3"/>
    <polygon points="220,110 210,105 210,115" fill="#98c379"/>
    <text x="160" y="95" fill="#98c379" font-family="sans-serif" font-size="11">Phóng dài tới biên</text>

    <line x1="40" y1="180" x2="110" y2="180" stroke="#abb2bf" stroke-width="2.5"/>
    <line x1="110" y1="180" x2="220" y2="180" stroke="#98c379" stroke-width="2.5" stroke-dasharray="5,3"/>
    <polygon points="220,180 210,175 210,185" fill="#98c379"/>

    <text x="140" y="295" fill="#e5c07b" font-family="sans-serif" font-size="12" text-anchor="middle">Đè phím Shift để đổi nhanh giữa Trim/Extend</text>
  </g>
</svg>
