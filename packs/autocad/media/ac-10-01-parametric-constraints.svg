<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Thiết kế thông minh với ràng buộc tham số Parametric Constraints</text>

  <!-- Left: Geometric Constraints -->
  <g transform="translate(60, 95)">
    <rect width="300" height="245" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="150" y="28" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Ràng buộc hình học (Geometric)</text>

    <!-- Parallel lines with constraint badge -->
    <g transform="translate(40, 50)">
      <line x1="20" y1="20" x2="180" y2="20" stroke="#61afef" stroke-width="2"/>
      <line x1="20" y1="50" x2="180" y2="50" stroke="#61afef" stroke-width="2"/>
      <!-- Parallel badge // -->
      <rect x="90" y="27" width="22" height="16" fill="#61afef" rx="2"/>
      <text x="101" y="39" fill="#14161a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">//</text>
      <text x="195" y="38" fill="#abb2bf" font-family="sans-serif" font-size="11">Song song (Parallel)</text>
    </g>

    <!-- Perpendicular lines with badge -->
    <g transform="translate(40, 115)">
      <line x1="40" y1="10" x2="40" y2="60" stroke="#98c379" stroke-width="2"/>
      <line x1="40" y1="60" x2="120" y2="60" stroke="#98c379" stroke-width="2"/>
      <!-- Perp badge ⊥ -->
      <rect x="47" y="43" width="16" height="14" fill="#98c379" rx="2"/>
      <text x="55" y="54" fill="#14161a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⊥</text>
      <text x="135" y="45" fill="#abb2bf" font-family="sans-serif" font-size="11">Vuông góc</text>
    </g>

    <text x="150" y="210" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">Cố định quan hệ hình học: Tiếp xúc (Tangent),</text>
    <text x="150" y="228" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">Đồng tâm (Concentric), Trùng điểm (Coincident)</text>
  </g>

  <!-- Right: Dimensional Constraints -->
  <g transform="translate(400, 95)">
    <rect width="300" height="245" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="150" y="28" fill="#e5c07b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Ràng buộc kích thước (Dimensional)</text>

    <!-- Rectangle with variable formulas -->
    <g transform="translate(60, 50)">
      <rect x="20" y="40" width="140" height="70" fill="#282c34" stroke="#e5c07b" stroke-width="2"/>

      <!-- Width d1 = 120 -->
      <line x1="20" y1="25" x2="160" y2="25" stroke="#e5c07b" stroke-width="1.5"/>
      <rect x="65" y="15" width="55" height="18" fill="#e5c07b" rx="2"/>
      <text x="92" y="28" fill="#14161a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">d1 = 120</text>

      <!-- Height d2 = d1 / 2 -->
      <line x1="175" y1="40" x2="175" y2="110" stroke="#e5c07b" stroke-width="1.5"/>
      <rect x="180" y="65" width="70" height="18" fill="#e5c07b" rx="2"/>
      <text x="215" y="78" fill="#14161a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">d2 = d1 / 2</text>
    </g>

    <text x="150" y="190" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Điều khiển kích thước bằng công thức đại số</text>
    <text x="150" y="210" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Đổi d1 = 200 $\to$ Chiều cao d2 tự động nhảy 100!</text>
    <text x="150" y="230" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">Quản lý phương trình trong Parameters Manager</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Parametric giúp thay đổi thiết kế theo phương trình toán học mà không phải vẽ lại hình</text>
</svg>
