<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Construction lines -->
  <line x1="80" y1="260" x2="320" y2="260" stroke="#61afef" stroke-width="3"/>
  <circle cx="80" cy="260" r="5" fill="#e06c75"/>
  <text x="60" y="290" fill="#e06c75" font-family="sans-serif" font-size="12" font-weight="bold">Điểm đầu (0,0)</text>

  <!-- Rubber-band line being drawn -->
  <line x1="320" y1="260" x2="560" y2="120" stroke="#e5c07b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="320" cy="260" r="5" fill="#98c379"/>
  <text x="310" y="290" fill="#98c379" font-family="sans-serif" font-size="12" font-weight="bold">Điểm 2 (100,0)</text>

  <!-- Dynamic Input floating tooltips -->
  <g transform="translate(420, 160)">
    <rect width="130" height="28" fill="#282c34" stroke="#61afef" stroke-width="1.5" rx="3"/>
    <text x="10" y="19" fill="#ffffff" font-family="monospace" font-size="13">150.00</text>
    <rect x="140" y="0" width="70" height="28" fill="#282c34" stroke="#e5c07b" stroke-width="1.5" rx="3"/>
    <text x="150" y="19" fill="#e5c07b" font-family="monospace" font-size="13">&lt; 30°</text>
  </g>

  <!-- Crosshair cursor -->
  <g stroke="#ffffff" stroke-width="1.5" transform="translate(560, 120)">
    <line x1="-15" y1="0" x2="15" y2="0"/>
    <line x1="0" y1="-15" x2="0" y2="15"/>
    <rect x="-4" y="-4" width="8" height="8" fill="none" stroke="#ffffff"/>
  </g>
  <text x="580" y="125" fill="#ffffff" font-family="sans-serif" font-size="12">Con trỏ chuột</text>

  <!-- Command Line Prompt at Bottom -->
  <g transform="translate(50, 350)">
    <rect width="660" height="38" fill="#22252c" stroke="#4c566a" stroke-width="1.5" rx="4"/>
    <text x="15" y="24" fill="#98c379" font-family="monospace" font-size="13">Command: LINE Specify next point or [Undo]:</text>
  </g>
</svg>
