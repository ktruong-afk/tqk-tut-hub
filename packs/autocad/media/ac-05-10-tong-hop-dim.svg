<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <rect width="760" height="460" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="420" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="50" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Bản vẽ chi tiết trục bậc hoàn chỉnh hệ thống kích thước (Chặng 05)</text>

  <!-- Stepped shaft geometry -->
  <!-- Left head: D40, L60 -->
  <rect x="140" y="190" width="80" height="80" fill="#242b35" stroke="#98c379" stroke-width="2.5"/>
  <!-- Middle collar: D70, L40 -->
  <rect x="220" y="160" width="60" height="140" fill="#242b35" stroke="#98c379" stroke-width="2.5"/>
  <!-- Main body: D50, L120 -->
  <rect x="280" y="175" width="160" height="110" fill="#242b35" stroke="#98c379" stroke-width="2.5"/>
  <!-- Right thread: D30, L60 -->
  <rect x="440" y="200" width="80" height="60" fill="#242b35" stroke="#98c379" stroke-width="2.5"/>

  <!-- Centerline -->
  <line x1="100" y1="230" x2="560" y2="230" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="10,4,2,4"/>

  <!-- Length Dimensions (Horizontal at Bottom) -->
  <!-- Dim 1: 80 -->
  <line x1="140" y1="330" x2="220" y2="330" stroke="#61afef" stroke-width="1.5"/>
  <line x1="140" y1="275" x2="140" y2="340" stroke="#61afef" stroke-width="1"/>
  <line x1="220" y1="305" x2="220" y2="340" stroke="#61afef" stroke-width="1"/>
  <text x="180" y="325" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">80</text>

  <!-- Dim 2: 60 -->
  <line x1="220" y1="330" x2="280" y2="330" stroke="#61afef" stroke-width="1.5"/>
  <line x1="280" y1="290" x2="280" y2="340" stroke="#61afef" stroke-width="1"/>
  <text x="250" y="325" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">60</text>

  <!-- Dim 3: 160 -->
  <line x1="280" y1="330" x2="440" y2="330" stroke="#61afef" stroke-width="1.5"/>
  <line x1="440" y1="265" x2="440" y2="340" stroke="#61afef" stroke-width="1"/>
  <text x="360" y="325" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">160</text>

  <!-- Dim 4: 80 -->
  <line x1="440" y1="330" x2="520" y2="330" stroke="#61afef" stroke-width="1.5"/>
  <line x1="520" y1="265" x2="520" y2="340" stroke="#61afef" stroke-width="1"/>
  <text x="480" y="325" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">80</text>

  <!-- Total Length Baseline (Tier 2): 380 -->
  <line x1="140" y1="370" x2="520" y2="370" stroke="#e5c07b" stroke-width="1.5"/>
  <line x1="140" y1="330" x2="140" y2="380" stroke="#e5c07b" stroke-width="1"/>
  <line x1="520" y1="330" x2="520" y2="380" stroke="#e5c07b" stroke-width="1"/>
  <text x="330" y="365" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">380 (Tổng chiều dài)</text>

  <!-- Diameter Dimensions (Vertical at Left & Top) -->
  <text x="105" y="235" fill="#61afef" font-family="monospace" font-size="11">Ø40</text>
  <text x="250" y="145" fill="#61afef" font-family="monospace" font-size="11">Ø70</text>
  <text x="360" y="165" fill="#61afef" font-family="monospace" font-size="11">Ø50</text>
  <text x="535" y="235" fill="#61afef" font-family="monospace" font-size="11">Ø30</text>

  <!-- Chamfer callout with Multileader -->
  <line x1="140" y1="190" x2="100" y2="150" stroke="#98c379" stroke-width="1.5"/>
  <line x1="100" y1="150" x2="60" y2="150" stroke="#98c379" stroke-width="1.5"/>
  <text x="60" y="140" fill="#98c379" font-family="monospace" font-size="11">2 × 45°</text>

  <text x="380" y="425" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Chuẩn cơ khí: Kích thước phân đoạn (Continue) bên trong, kích thước bao (Baseline) bên ngoài</text>
</svg>
