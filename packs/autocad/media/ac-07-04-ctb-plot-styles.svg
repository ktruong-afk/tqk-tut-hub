<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Nguyên lý bảng phong cách nét in CTB (Color-dependent Plot Style)</text>

  <!-- Left: Drawing Colors -->
  <g transform="translate(60, 95)">
    <rect width="250" height="240" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="125" y="30" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Màu sắc trên màn hình CAD</text>

    <!-- Color items -->
    <g transform="translate(20, 50)">
      <circle cx="15" cy="15" r="10" fill="#e06c75"/>
      <text x="35" y="19" fill="#abb2bf" font-family="sans-serif" font-size="11">Color 1 (Red) - Nét mảnh</text>
    </g>
    <g transform="translate(20, 95)">
      <circle cx="15" cy="15" r="10" fill="#e5c07b"/>
      <text x="35" y="19" fill="#abb2bf" font-family="sans-serif" font-size="11">Color 2 (Yellow) - Nét vừa</text>
    </g>
    <g transform="translate(20, 140)">
      <circle cx="15" cy="15" r="10" fill="#98c379"/>
      <text x="35" y="19" fill="#abb2bf" font-family="sans-serif" font-size="11">Color 3 (Green) - Nét đậm</text>
    </g>
    <g transform="translate(20, 185)">
      <circle cx="15" cy="15" r="10" fill="#56b6c2"/>
      <text x="35" y="19" fill="#abb2bf" font-family="sans-serif" font-size="11">Color 4 (Cyan) - Cột / Tường cắt</text>
    </g>
  </g>

  <!-- Middle: CTB mapping arrow -->
  <g transform="translate(325, 175)">
    <rect width="110" height="70" fill="#282c34" stroke="#e5c07b" stroke-width="1.5" rx="4"/>
    <text x="55" y="28" fill="#e5c07b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Bảng CTB</text>
    <text x="55" y="48" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Quy đổi nét in</text>
    <path d="M 5 35 L 105 35" stroke="#e5c07b" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <!-- Right: Printed Output -->
  <g transform="translate(450, 95)">
    <rect width="250" height="240" fill="#ffffff" stroke="#abb2bf" rx="4"/>
    <text x="125" y="30" fill="#14161a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Bản in thật (Đen trắng / PDF)</text>

    <!-- Black lines with varying weights -->
    <g transform="translate(20, 50)">
      <line x1="10" y1="15" x2="60" y2="15" stroke="#000000" stroke-width="1"/>
      <text x="75" y="19" fill="#333333" font-family="sans-serif" font-size="11">Màu đen · Dày 0.13 mm</text>
    </g>
    <g transform="translate(20, 95)">
      <line x1="10" y1="15" x2="60" y2="15" stroke="#000000" stroke-width="2.5"/>
      <text x="75" y="19" fill="#333333" font-family="sans-serif" font-size="11">Màu đen · Dày 0.25 mm</text>
    </g>
    <g transform="translate(20, 140)">
      <line x1="10" y1="15" x2="60" y2="15" stroke="#000000" stroke-width="4"/>
      <text x="75" y="19" fill="#333333" font-family="sans-serif" font-size="11">Màu đen · Dày 0.35 mm</text>
    </g>
    <g transform="translate(20, 185)">
      <line x1="10" y1="15" x2="60" y2="15" stroke="#000000" stroke-width="6"/>
      <text x="75" y="19" fill="#333333" font-family="sans-serif" font-size="11">Màu đen · Dày 0.50 mm</text>
    </g>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Bảng nét in CTB quy định: Màu màn hình là gì $\to$ Ra giấy in màu gì và nét dày bao nhiêu mm</text>
</svg>
