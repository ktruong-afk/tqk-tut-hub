<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Các lệnh tiện ích thao tác Layer nhanh (Layer Utilities)</text>

  <!-- Tool 1: LAYISO -->
  <g transform="translate(60, 90)">
    <rect width="300" height="130" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <rect x="20" y="15" width="80" height="26" fill="#2d5e8a" rx="3"/>
    <text x="35" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">LAYISO</text>
    <text x="110" y="32" fill="#61afef" font-family="sans-serif" font-size="14" font-weight="bold">Cô lập Layer</text>
    <text x="20" y="65" fill="#abb2bf" font-family="sans-serif" font-size="11">• Bấm vào 1 vật thể → Tự ẩn/khoá mọi layer khác</text>
    <text x="20" y="85" fill="#abb2bf" font-family="sans-serif" font-size="11">• Rất tiện khi cần chọn hoặc xoá hàng loạt 1 loại nét</text>
    <text x="20" y="105" fill="#98c379" font-family="sans-serif" font-size="11">Phục hồi lại bằng lệnh: LAYUNISO</text>
  </g>

  <!-- Tool 2: LAYFRZ -->
  <g transform="translate(400, 90)">
    <rect width="300" height="130" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <rect x="20" y="15" width="80" height="26" fill="#353b48" rx="3"/>
    <text x="33" y="32" fill="#61afef" font-family="sans-serif" font-size="12" font-weight="bold">LAYFRZ</text>
    <text x="110" y="32" fill="#61afef" font-family="sans-serif" font-size="14" font-weight="bold">Đóng băng Layer</text>
    <text x="20" y="65" fill="#abb2bf" font-family="sans-serif" font-size="11">• Nhấp chọn đối tượng để Freeze ngay layer đó</text>
    <text x="20" y="85" fill="#abb2bf" font-family="sans-serif" font-size="11">• Giúp nhẹ bộ nhớ đồ hoạ màn hình</text>
    <text x="20" y="105" fill="#98c379" font-family="sans-serif" font-size="11">Làm tan băng toàn bộ bằng: LAYTHW</text>
  </g>

  <!-- Tool 3: LAYOFF -->
  <g transform="translate(60, 245)">
    <rect width="300" height="130" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <rect x="20" y="15" width="80" height="26" fill="#353b48" rx="3"/>
    <text x="31" y="32" fill="#e5c07b" font-family="sans-serif" font-size="12" font-weight="bold">LAYOFF</text>
    <text x="110" y="32" fill="#e5c07b" font-family="sans-serif" font-size="14" font-weight="bold">Tắt bóng đèn Layer</text>
    <text x="20" y="65" fill="#abb2bf" font-family="sans-serif" font-size="11">• Nhấp chuột tắt nhanh hiển thị của từng lớp</text>
    <text x="20" y="85" fill="#abb2bf" font-family="sans-serif" font-size="11">• Không cần mở bảng Layer Properties Manager</text>
    <text x="20" y="105" fill="#98c379" font-family="sans-serif" font-size="11">Bật lại toàn bộ bằng: LAYON</text>
  </g>

  <!-- Tool 4: LAYMRG -->
  <g transform="translate(400, 245)">
    <rect width="300" height="130" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <rect x="20" y="15" width="80" height="26" fill="#353b48" rx="3"/>
    <text x="29" y="32" fill="#e06c75" font-family="sans-serif" font-size="12" font-weight="bold">LAYMRG</text>
    <text x="110" y="32" fill="#e06c75" font-family="sans-serif" font-size="14" font-weight="bold">Gộp Layer (Merge)</text>
    <text x="20" y="65" fill="#abb2bf" font-family="sans-serif" font-size="11">• Chuyển toàn bộ vật thể từ layer rác sang layer chuẩn</text>
    <text x="20" y="85" fill="#abb2bf" font-family="sans-serif" font-size="11">• Tự động xoá bỏ layer rác đã bị gộp</text>
    <text x="20" y="105" fill="#98c379" font-family="sans-serif" font-size="11">Cực kỳ hữu ích khi làm sạch bản vẽ đối tác</text>
  </g>
</svg>
