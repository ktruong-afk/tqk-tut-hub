<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Nguyên lý khối Block: Đóng gói 1 lần - Tái sử dụng vĩnh viễn</text>

  <!-- Left: Source Geometry -->
  <g transform="translate(60, 90)">
    <rect width="260" height="260" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="130" y="30" fill="#61afef" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Tạo Block (Lệnh BLOCK - B)</text>

    <!-- Door geometry (cánh cửa + cung mở) -->
    <rect x="60" y="160" width="10" height="70" fill="#61afef" stroke="#61afef" stroke-width="1"/>
    <path d="M 60 230 A 70 70 0 0 0 130 160" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
    <line x1="60" y1="230" x2="60" y2="160" stroke="#abb2bf" stroke-width="1.5"/>

    <!-- Base point insertion point -->
    <circle cx="60" cy="230" r="5" fill="#e06c75"/>
    <text x="60" y="250" fill="#e06c75" font-family="sans-serif" font-size="11" text-anchor="middle">Insertion Point (0,0)</text>

    <text x="130" y="70" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">• Tên Block: "CUA-DI-D900"</text>
    <text x="130" y="90" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">• Gom toàn bộ nét rời thành 1 khối</text>
  </g>

  <!-- Right: Multiple Insertions -->
  <g transform="translate(380, 90)">
    <rect width="320" height="260" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="160" y="30" fill="#98c379" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Chèn vào bản vẽ (Lệnh INSERT - I)</text>

    <!-- Insert 1 (Scale 1, Rot 0) -->
    <g transform="translate(40, 60)">
      <rect x="20" y="60" width="8" height="50" fill="#98c379"/>
      <path d="M 20 110 A 50 50 0 0 0 70 60" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
      <circle cx="20" cy="110" r="3" fill="#e06c75"/>
      <text x="45" y="130" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Cửa phòng 1</text>
    </g>

    <!-- Insert 2 (Rotated 90) -->
    <g transform="translate(180, 50) rotate(90 50 50)">
      <rect x="20" y="60" width="8" height="50" fill="#98c379"/>
      <path d="M 20 110 A 50 50 0 0 0 70 60" stroke="#e5c07b" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
      <circle cx="20" cy="110" r="3" fill="#e06c75"/>
    </g>
    <text x="235" y="190" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Cửa phòng 2 (Xoay 90°)</text>

    <text x="160" y="240" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Sửa 1 block gốc → Toàn bộ các block tự cập nhật</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Tiết kiệm 80% dung lượng bản vẽ và kiểm soát thống kê số lượng tự động</text>
</svg>
