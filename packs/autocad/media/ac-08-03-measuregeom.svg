<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Bộ công cụ đo đạc hình học nhanh (MEASUREGEOM &amp; Quick Measure)</text>

  <!-- Left: Quick Measure Mode -->
  <g transform="translate(50, 95)">
    <rect width="320" height="245" fill="#1e222b" stroke="#61afef" stroke-width="1" rx="4"/>
    <text x="160" y="28" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Quick Measure (Rê chuột xem tức thì)</text>

    <!-- Part geometry -->
    <rect x="50" y="50" width="220" height="120" fill="#282c34" stroke="#abb2bf" stroke-width="1.5"/>
    <circle cx="160" cy="110" r="30" fill="#14161a" stroke="#abb2bf" stroke-width="1.5"/>

    <!-- Dynamic Orange measurement HUD -->
    <line x1="50" y1="40" x2="270" y2="40" stroke="#e5c07b" stroke-width="1.5"/>
    <polygon points="50,37 40,40 50,43" fill="#e5c07b"/>
    <polygon points="270,37 280,40 270,43" fill="#e5c07b"/>
    <rect x="135" y="28" width="50" height="18" fill="#e5c07b" rx="2"/>
    <text x="160" y="41" fill="#14161a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">220.0</text>

    <line x1="35" y1="50" x2="35" y2="170" stroke="#e5c07b" stroke-width="1.5"/>
    <polygon points="32,50 35,40 38,50" fill="#e5c07b"/>
    <polygon points="32,170 35,180 38,170" fill="#e5c07b"/>
    <rect x="10" y="100" width="45" height="18" fill="#e5c07b" rx="2"/>
    <text x="32" y="113" fill="#14161a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">120.0</text>

    <!-- Center radius HUD -->
    <line x1="160" y1="110" x2="181" y2="131" stroke="#98c379" stroke-width="1.5"/>
    <text x="195" y="138" fill="#98c379" font-family="sans-serif" font-size="11" font-weight="bold">R30.0</text>

    <text x="160" y="200" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Chỉ cần rê chuột qua vùng trống,</text>
    <text x="160" y="220" fill="#e5c07b" font-family="sans-serif" font-size="11" text-anchor="middle">mọi kích thước, góc 90° tự động hiện lên!</text>
  </g>

  <!-- Right: Dedicated Measurement Commands -->
  <g transform="translate(390, 95)">
    <rect width="320" height="245" fill="#1e222b" stroke="#98c379" stroke-width="1" rx="4"/>
    <text x="160" y="28" fill="#98c379" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Các lệnh tra cứu chuyên sâu</text>

    <!-- Table of commands -->
    <g transform="translate(20, 50)">
      <rect width="280" height="36" fill="#282c34" rx="3"/>
      <text x="15" y="23" fill="#61afef" font-family="sans-serif" font-size="12" font-weight="bold">DIST (DI)</text>
      <text x="95" y="23" fill="#abb2bf" font-family="sans-serif" font-size="11">Đo khoảng cách dX, dY, dZ, góc</text>
    </g>
    <g transform="translate(20, 95)">
      <rect width="280" height="36" fill="#282c34" rx="3"/>
      <text x="15" y="23" fill="#98c379" font-family="sans-serif" font-size="12" font-weight="bold">AREA (AA)</text>
      <text x="95" y="23" fill="#abb2bf" font-family="sans-serif" font-size="11">Tính chu vi và diện tích (cộng/trừ)</text>
    </g>
    <g transform="translate(20, 140)">
      <rect width="280" height="36" fill="#282c34" rx="3"/>
      <text x="15" y="23" fill="#e5c07b" font-family="sans-serif" font-size="12" font-weight="bold">ID</text>
      <text x="95" y="23" fill="#abb2bf" font-family="sans-serif" font-size="11">Lấy toạ độ tuyệt đối X, Y, Z</text>
    </g>
    <g transform="translate(20, 185)">
      <rect width="280" height="36" fill="#282c34" rx="3"/>
      <text x="15" y="23" fill="#c678dd" font-family="sans-serif" font-size="12" font-weight="bold">LIST (LI)</text>
      <text x="95" y="23" fill="#abb2bf" font-family="sans-serif" font-size="11">Bảng thuộc tính toàn diện chi tiết</text>
    </g>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Kiểm tra thông số kỹ thuật nhanh chóng mà không cần tạo đường kích thước rác trong bản vẽ</text>
</svg>
