<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Cấu tạo của đường chỉ dẫn Multileader (MLEADER)</text>

  <!-- Part diagram -->
  <g transform="translate(60, 80)">
    <!-- Arrowhead and Leader Line -->
    <polygon points="120,220 135,214 135,226" fill="#61afef"/>
    <circle cx="120" cy="220" r="4" fill="#e06c75"/>
    <text x="120" y="245" fill="#e06c75" font-family="sans-serif" font-size="12" text-anchor="middle">1. Mũi tên (Arrowhead)</text>

    <!-- Slanted leader line -->
    <line x1="120" y1="220" x2="260" y2="120" stroke="#61afef" stroke-width="2"/>
    <text x="160" y="160" fill="#61afef" font-family="sans-serif" font-size="12">2. Đường xiên (Leader line)</text>

    <!-- Horizontal Landing -->
    <line x1="260" y1="120" x2="380" y2="120" stroke="#98c379" stroke-width="2.5"/>
    <text x="320" y="110" fill="#98c379" font-family="sans-serif" font-size="12" text-anchor="middle">3. Đoạn ngang (Landing)</text>

    <!-- Content: Multiline Text -->
    <g transform="translate(390, 90)">
      <rect width="240" height="60" fill="#1e222b" stroke="#4c566a" stroke-width="1" rx="4"/>
      <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">4. Nội dung (Content)</text>
      <text x="15" y="45" fill="#abb2bf" font-family="sans-serif" font-size="11">Thép C45 tôi cứng HRC 50</text>
    </g>

    <!-- Second example: Balloon Bubble Callout -->
    <g transform="translate(260, 180)">
      <polygon points="0,60 15,54 15,66" fill="#e5c07b"/>
      <line x1="0" y1="60" x2="80" y2="10" stroke="#e5c07b" stroke-width="2"/>
      <line x1="80" y1="10" x2="130" y2="10" stroke="#e5c07b" stroke-width="2"/>
      <!-- Circle bubble -->
      <circle cx="155" cy="10" r="24" stroke="#e5c07b" stroke-width="2" fill="#2d3340"/>
      <text x="155" y="16" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">01</text>
      <text x="200" y="15" fill="#abb2bf" font-family="sans-serif" font-size="11">Bong bóng số hiệu vị trí</text>
    </g>
  </g>

  <text x="380" y="400" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Tự động gắn kết: Khi di chuyển khối chữ, đường mũi tên tự co giãn bám theo</text>
</svg>
