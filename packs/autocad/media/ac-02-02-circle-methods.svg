<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Method 1: Center, Radius -->
  <g transform="translate(60, 50)">
    <circle cx="100" cy="90" r="60" stroke="#61afef" stroke-width="2.5" fill="none"/>
    <circle cx="100" cy="90" r="4" fill="#e06c75"/>
    <line x1="100" y1="90" x2="160" y2="90" stroke="#e5c07b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="110" y="80" fill="#e5c07b" font-family="sans-serif" font-size="11">R (Bán kính)</text>
    <text x="100" y="175" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Center, Radius</text>
  </g>

  <!-- Method 2: Center, Diameter -->
  <g transform="translate(290, 50)">
    <circle cx="100" cy="90" r="60" stroke="#98c379" stroke-width="2.5" fill="none"/>
    <circle cx="100" cy="90" r="4" fill="#e06c75"/>
    <line x1="40" y1="90" x2="160" y2="90" stroke="#e5c07b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="75" y="80" fill="#e5c07b" font-family="sans-serif" font-size="11">Ø (Đường kính)</text>
    <text x="100" y="175" fill="#98c379" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Center, Diameter</text>
  </g>

  <!-- Method 3: 2-Point (2P) -->
  <g transform="translate(520, 50)">
    <circle cx="100" cy="90" r="60" stroke="#c678dd" stroke-width="2.5" fill="none"/>
    <circle cx="40" cy="90" r="5" fill="#e06c75"/>
    <circle cx="160" cy="90" r="5" fill="#e06c75"/>
    <text x="30" y="115" fill="#e06c75" font-family="sans-serif" font-size="11">Điểm 1</text>
    <text x="150" y="115" fill="#e06c75" font-family="sans-serif" font-size="11">Điểm 2</text>
    <text x="100" y="175" fill="#c678dd" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. 2-Point (2P)</text>
  </g>

  <!-- Method 4: Tan, Tan, Radius (TTR) -->
  <g transform="translate(180, 240)">
    <line x1="20" y1="120" x2="180" y2="120" stroke="#abb2bf" stroke-width="2"/>
    <line x1="20" y1="120" x2="20" y2="10" stroke="#abb2bf" stroke-width="2"/>
    <circle cx="80" cy="60" r="50" stroke="#d19a66" stroke-width="2.5" fill="none"/>
    <circle cx="80" cy="110" r="4" fill="#98c379"/>
    <circle cx="30" cy="60" r="4" fill="#98c379"/>
    <text x="100" y="145" fill="#d19a66" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">4. Tan, Tan, Radius (TTR)</text>
  </g>

  <!-- Method 5: 3-Point (3P) -->
  <g transform="translate(420, 240)">
    <circle cx="100" cy="60" r="55" stroke="#56b6c2" stroke-width="2.5" fill="none"/>
    <circle cx="55" cy="35" r="5" fill="#e06c75"/>
    <circle cx="150" cy="45" r="5" fill="#e06c75"/>
    <circle cx="95" cy="115" r="5" fill="#e06c75"/>
    <text x="100" y="145" fill="#56b6c2" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">5. 3-Point (3P)</text>
  </g>
</svg>
