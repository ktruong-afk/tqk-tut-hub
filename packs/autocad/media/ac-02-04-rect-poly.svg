<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Left: RECTANG (Hai điểm góc đối diện) -->
  <g transform="translate(60, 60)">
    <rect width="280" height="300" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#61afef" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh RECTANG</text>
    
    <rect x="50" y="80" width="180" height="120" stroke="#61afef" stroke-width="3" fill="none"/>
    <circle cx="50" cy="200" r="5" fill="#e06c75"/>
    <text x="10" y="225" fill="#e06c75" font-family="sans-serif" font-size="12">Góc 1: (X1, Y1)</text>

    <circle cx="230" cy="80" r="5" fill="#98c379"/>
    <text x="175" y="70" fill="#98c379" font-family="sans-serif" font-size="12">Góc 2: @W,H</text>

    <line x1="50" y1="200" x2="230" y2="80" stroke="#abb2bf" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="140" y="260" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Tạo một đối tượng Polyline kín duy nhất</text>
  </g>

  <!-- Right: POLYGON (Nội tiếp và Ngoại tiếp) -->
  <g transform="translate(400, 60)">
    <rect width="280" height="300" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#98c379" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh POLYGON (Đa giác)</text>
    
    <!-- Inscribed polygon (Lục giác nội tiếp) -->
    <g transform="translate(30, 60)">
      <circle cx="70" cy="70" r="50" stroke="#4c566a" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
      <polygon points="120,70 95,113 45,113 20,70 45,27 95,27" stroke="#98c379" stroke-width="2.5" fill="none"/>
      <line x1="70" y1="70" x2="120" y2="70" stroke="#e5c07b" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="3" fill="#e06c75"/>
      <text x="70" y="145" fill="#98c379" font-family="sans-serif" font-size="12" text-anchor="middle">Inscribed (Nội tiếp)</text>
    </g>

    <!-- Circumscribed polygon (Lục giác ngoại tiếp) -->
    <g transform="translate(150, 60)">
      <circle cx="70" cy="70" r="43" stroke="#4c566a" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
      <polygon points="120,70 95,113 45,113 20,70 45,27 95,27" stroke="#e5c07b" stroke-width="2.5" fill="none" transform="rotate(30 70 70)"/>
      <line x1="70" y1="70" x2="70" y2="27" stroke="#61afef" stroke-width="1.5"/>
      <circle cx="70" cy="70" r="3" fill="#e06c75"/>
      <text x="70" y="145" fill="#e5c07b" font-family="sans-serif" font-size="12" text-anchor="middle">Circumscribed (Ngoại tiếp)</text>
    </g>

    <text x="140" y="260" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Tuỳ chọn số cạnh: 3 đến 1024</text>
  </g>
</svg>
