<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Left: MOVE Operation -->
  <g transform="translate(60, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#61afef" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh MOVE (Di chuyển)</text>
    
    <!-- Ghost original shape -->
    <rect x="40" y="160" width="80" height="60" stroke="#4c566a" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
    <text x="80" y="240" fill="#4c566a" font-family="sans-serif" font-size="11" text-anchor="middle">Vị trí gốc (Bị dời đi)</text>

    <!-- Base Point -->
    <circle cx="40" cy="220" r="5" fill="#e06c75"/>
    <text x="35" y="205" fill="#e06c75" font-family="sans-serif" font-size="11">Base Point</text>

    <!-- Displacement vector -->
    <line x1="40" y1="220" x2="160" y2="100" stroke="#e5c07b" stroke-width="2" stroke-dasharray="6,3"/>
    <polygon points="160,100 150,108 154,116" fill="#e5c07b"/>

    <!-- New location shape -->
    <rect x="160" y="40" width="80" height="60" stroke="#61afef" stroke-width="2.5" fill="#2d5e8a" fill-opacity="0.3"/>
    <circle cx="160" cy="100" r="5" fill="#98c379"/>
    <text x="160" y="125" fill="#98c379" font-family="sans-serif" font-size="11">Second Point</text>
    <text x="140" y="295" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Vật thể gốc biến mất khỏi vị trí cũ</text>
  </g>

  <!-- Right: COPY Operation -->
  <g transform="translate(400, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#98c379" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh COPY (Sao chép)</text>

    <!-- Original shape stays intact -->
    <rect x="40" y="160" width="80" height="60" stroke="#98c379" stroke-width="2.5" fill="#387a38" fill-opacity="0.3"/>
    <circle cx="40" cy="220" r="5" fill="#e06c75"/>
    <text x="35" y="205" fill="#e06c75" font-family="sans-serif" font-size="11">Base Point</text>
    <text x="80" y="240" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Vật thể gốc (Giữ nguyên)</text>

    <!-- Multiple copies vector -->
    <line x1="40" y1="220" x2="160" y2="100" stroke="#e5c07b" stroke-width="2" stroke-dasharray="6,3"/>
    <rect x="160" y="40" width="80" height="60" stroke="#98c379" stroke-width="2" fill="none"/>
    <circle cx="160" cy="100" r="5" fill="#98c379"/>
    <text x="160" y="125" fill="#98c379" font-family="sans-serif" font-size="11">Bản sao 1</text>

    <text x="140" y="295" fill="#e5c07b" font-family="sans-serif" font-size="12" text-anchor="middle">Có thể nhấp liên tiếp nhiều bản sao</text>
  </g>
</svg>
