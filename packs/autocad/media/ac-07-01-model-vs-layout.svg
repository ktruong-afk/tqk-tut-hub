<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">So sánh không gian Model Space và Layout (Paper Space)</text>

  <!-- Left: Model Space -->
  <g transform="translate(50, 90)">
    <rect width="310" height="260" fill="#1e222b" stroke="#61afef" stroke-width="1.5" rx="4"/>
    <rect width="310" height="30" fill="#282c34" rx="4"/>
    <text x="155" y="20" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Model Space (Không gian mô hình)</text>

    <!-- Infinite grid illustration -->
    <rect x="20" y="45" width="270" height="150" fill="#14161a" stroke="#2d3340"/>
    <line x1="20" y1="80" x2="290" y2="80" stroke="#282c34" stroke-dasharray="3,3"/>
    <line x1="20" y1="120" x2="290" y2="120" stroke="#282c34" stroke-dasharray="3,3"/>
    <line x1="20" y1="160" x2="290" y2="160" stroke="#282c34" stroke-dasharray="3,3"/>
    <line x1="80" y1="45" x2="80" y2="195" stroke="#282c34" stroke-dasharray="3,3"/>
    <line x1="160" y1="45" x2="160" y2="195" stroke="#282c34" stroke-dasharray="3,3"/>
    <line x1="230" y1="45" x2="230" y2="195" stroke="#282c34" stroke-dasharray="3,3"/>

    <!-- Building outline -->
    <rect x="70" y="90" width="170" height="80" fill="#61afef" fill-opacity="0.15" stroke="#61afef" stroke-width="1.5"/>
    <text x="155" y="135" fill="#61afef" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Ngôi nhà thật (Tỉ lệ 1:1)</text>

    <text x="155" y="215" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">• Tường dài 15m $\to$ Vẽ đúng 15,000mm</text>
    <text x="155" y="235" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">• Không gian vô hạn, không có khổ giấy</text>
  </g>

  <!-- Right: Layout Space -->
  <g transform="translate(400, 90)">
    <rect width="310" height="260" fill="#1e222b" stroke="#98c379" stroke-width="1.5" rx="4"/>
    <rect width="310" height="30" fill="#282c34" rx="4"/>
    <text x="155" y="20" fill="#98c379" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Layout / Paper Space (Trang giấy in)</text>

    <!-- White Paper Sheet -->
    <rect x="35" y="45" width="240" height="150" fill="#ffffff" stroke="#abb2bf" rx="2"/>
    <!-- Margin border -->
    <rect x="45" y="53" width="220" height="134" fill="none" stroke="#282c34" stroke-width="1"/>
    <!-- Title block -->
    <rect x="180" y="152" width="85" height="35" fill="#e5c07b" fill-opacity="0.2" stroke="#e5c07b"/>
    <text x="222" y="173" fill="#333333" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Khung tên A3</text>

    <!-- Viewport window -->
    <rect x="55" y="63" width="120" height="100" fill="#14161a" stroke="#61afef" stroke-dasharray="4,2"/>
    <rect x="68" y="85" width="90" height="45" fill="#61afef" fill-opacity="0.2" stroke="#61afef"/>
    <text x="115" y="112" fill="#ffffff" font-family="sans-serif" font-size="9" text-anchor="middle">Viewport 1:100</text>

    <text x="155" y="215" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">• Khổ giấy in thực tế (A4, A3, A1, A0)</text>
    <text x="155" y="235" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">• Nhìn vào Model qua khung cửa sổ Viewport</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Nguyên tắc vàng: Vẽ 1:1 ở Model $\to$ Trình bày tỉ lệ, khung tên và in ấn ở Layout</text>
</svg>
