<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Left: LINE (Các đoạn rời rạc) -->
  <g transform="translate(60, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#e06c75" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh LINE (Đoạn rời)</text>

    <!-- 3 segments with gaps or grips shown -->
    <line x1="50" y1="80" x2="150" y2="80" stroke="#61afef" stroke-width="2.5"/>
    <line x1="150" y1="80" x2="220" y2="180" stroke="#98c379" stroke-width="2.5"/>
    <line x1="220" y1="180" x2="80" y2="240" stroke="#e5c07b" stroke-width="2.5"/>

    <!-- Grips -->
    <rect x="46" y="76" width="8" height="8" fill="#61afef"/>
    <rect x="146" y="76" width="8" height="8" fill="#61afef"/>
    <rect x="216" y="176" width="8" height="8" fill="#61afef"/>
    <rect x="76" y="236" width="8" height="8" fill="#61afef"/>

    <text x="140" y="280" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Gồm 3 đối tượng riêng biệt</text>
    <text x="140" y="300" fill="#e06c75" font-family="sans-serif" font-size="12" text-anchor="middle">Không có thuộc tính bề dày (Width)</text>
  </g>

  <!-- Right: PLINE (Một đối tượng liền mạch có bề rộng và cung tròn) -->
  <g transform="translate(400, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#98c379" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh PLINE (Đa tuyến)</text>

    <!-- Continuous polyline with width and arc -->
    <path d="M 50 80 L 140 80 A 50 50 0 0 1 210 170 L 90 230" fill="none" stroke="#98c379" stroke-width="7" stroke-linecap="round"/>

    <!-- Grips -->
    <rect x="46" y="76" width="8" height="8" fill="#61afef"/>
    <rect x="136" y="76" width="8" height="8" fill="#61afef"/>
    <rect x="206" y="166" width="8" height="8" fill="#61afef"/>
    <rect x="86" y="226" width="8" height="8" fill="#61afef"/>

    <text x="140" y="280" fill="#98c379" font-family="sans-serif" font-size="12" text-anchor="middle">1 đối tượng duy nhất, liền khối</text>
    <text x="140" y="300" fill="#e5c07b" font-family="sans-serif" font-size="12" text-anchor="middle">Kết hợp đoạn thẳng + cung tròn + bề dày</text>
  </g>
</svg>
