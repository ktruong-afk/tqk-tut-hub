<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#21252b" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="40" y="50" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Layer Properties Manager (Bảng quản lý lớp)</text>

  <!-- Toolbar buttons: New Layer, Delete, Set Current -->
  <g transform="translate(40, 65)">
    <rect x="0" y="0" width="85" height="26" fill="#353b45" rx="3" stroke="#485060"/>
    <text x="12" y="17" fill="#98c379" font-family="sans-serif" font-size="11" font-weight="bold">+ New Layer</text>
    <rect x="95" y="0" width="75" height="26" fill="#353b45" rx="3" stroke="#485060"/>
    <text x="105" y="17" fill="#e06c75" font-family="sans-serif" font-size="11">✕ Delete</text>
    <rect x="180" y="0" width="90" height="26" fill="#2d5e8a" rx="3"/>
    <text x="190" y="17" fill="#ffffff" font-family="sans-serif" font-size="11">✔ Set Current</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(40, 105)">
    <rect width="680" height="30" fill="#282c34" stroke="#3b4048" stroke-width="1"/>
    <text x="15" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">Trạng thái</text>
    <text x="80" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">Tên Layer (Name)</text>
    <text x="230" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">On/Off</text>
    <text x="280" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">Freeze</text>
    <text x="330" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">Lock</text>
    <text x="380" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">Color</text>
    <text x="460" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">Linetype</text>
    <text x="560" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11" font-weight="bold">Lineweight</text>
  </g>

  <!-- Row 1: Layer 0 -->
  <g transform="translate(40, 137)">
    <rect width="680" height="30" fill="#1e2227" stroke="#2c313a" stroke-width="1"/>
    <text x="30" y="20" fill="#98c379">✔</text>
    <text x="80" y="20" fill="#ffffff" font-family="sans-serif" font-size="12">0 (Lớp mặc định)</text>
    <text x="240" y="20" fill="#e5c07b">💡</text>
    <text x="290" y="20" fill="#61afef">☀️</text>
    <text x="340" y="20" fill="#98c379">🔓</text>
    <rect x="380" y="7" width="30" height="16" fill="#ffffff" rx="2"/>
    <text x="420" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11">White</text>
    <text x="460" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11">Continuous</text>
    <text x="560" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11">Default</text>
  </g>

  <!-- Row 2: Net-Thay -->
  <g transform="translate(40, 169)">
    <rect width="680" height="30" fill="#242830" stroke="#2c313a" stroke-width="1"/>
    <text x="80" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Net-Thay</text>
    <text x="240" y="20" fill="#e5c07b">💡</text>
    <text x="290" y="20" fill="#61afef">☀️</text>
    <text x="340" y="20" fill="#98c379">🔓</text>
    <rect x="380" y="7" width="30" height="16" fill="#ffffff" rx="2"/>
    <text x="420" y="20" fill="#ffffff" font-family="sans-serif" font-size="11">White</text>
    <text x="460" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11">Continuous</text>
    <text x="560" y="20" fill="#61afef" font-family="sans-serif" font-size="11">0.35 mm</text>
  </g>

  <!-- Row 3: Net-Khuat -->
  <g transform="translate(40, 201)">
    <rect width="680" height="30" fill="#1e2227" stroke="#2c313a" stroke-width="1"/>
    <text x="80" y="20" fill="#e5c07b" font-family="sans-serif" font-size="12">Net-Khuat</text>
    <text x="240" y="20" fill="#e5c07b">💡</text>
    <text x="290" y="20" fill="#61afef">☀️</text>
    <text x="340" y="20" fill="#98c379">🔓</text>
    <rect x="380" y="7" width="30" height="16" fill="#e5c07b" rx="2"/>
    <text x="420" y="20" fill="#e5c07b" font-family="sans-serif" font-size="11">Yellow</text>
    <text x="460" y="20" fill="#e5c07b" font-family="sans-serif" font-size="11">HIDDEN</text>
    <text x="560" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11">0.18 mm</text>
  </g>

  <!-- Row 4: Net-Truc -->
  <g transform="translate(40, 233)">
    <rect width="680" height="30" fill="#242830" stroke="#2c313a" stroke-width="1"/>
    <text x="80" y="20" fill="#e06c75" font-family="sans-serif" font-size="12">Net-Truc</text>
    <text x="240" y="20" fill="#e5c07b">💡</text>
    <text x="290" y="20" fill="#61afef">☀️</text>
    <text x="340" y="20" fill="#98c379">🔓</text>
    <rect x="380" y="7" width="30" height="16" fill="#e06c75" rx="2"/>
    <text x="420" y="20" fill="#e06c75" font-family="sans-serif" font-size="11">Red</text>
    <text x="460" y="20" fill="#e06c75" font-family="sans-serif" font-size="11">CENTER</text>
    <text x="560" y="20" fill="#abb2bf" font-family="sans-serif" font-size="11">0.15 mm</text>
  </g>

  <!-- Explanatory note -->
  <text x="380" y="380" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Quản lý đồng bộ: Đổi màu của Layer → Toàn bộ đối tượng thuộc Layer tự đổi màu theo</text>
</svg>
