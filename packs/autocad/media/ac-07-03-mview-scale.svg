<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Làm chủ khung nhìn Viewport (MVIEW): Tỉ lệ và Khóa khung</text>

  <!-- Left: Layout with 2 Viewports -->
  <g transform="translate(50, 90)">
    <!-- Paper Sheet A3 -->
    <rect width="360" height="250" fill="#ffffff" stroke="#abb2bf" rx="2"/>
    <rect x="10" y="10" width="340" height="230" fill="none" stroke="#333333" stroke-width="1.5"/>

    <!-- Viewport 1: Plan 1:100 -->
    <rect x="20" y="20" width="190" height="210" fill="#14161a" stroke="#61afef" stroke-width="2"/>
    <rect x="35" y="45" width="160" height="130" fill="#61afef" fill-opacity="0.15" stroke="#61afef" stroke-width="1.5"/>
    <text x="115" y="115" fill="#61afef" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">MẶT BẰNG TỔNG THỂ</text>
    <rect x="25" y="25" width="80" height="18" fill="#61afef" rx="2"/>
    <text x="65" y="38" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Scale: 1:100</text>
    <!-- Lock symbol -->
    <text x="195" y="38" fill="#98c379" font-family="sans-serif" font-size="12">🔒</text>

    <!-- Viewport 2: Detail 1:25 -->
    <rect x="220" y="20" width="120" height="130" fill="#14161a" stroke="#e5c07b" stroke-width="2"/>
    <circle cx="280" cy="80" r="35" fill="#e5c07b" fill-opacity="0.2" stroke="#e5c07b" stroke-width="1.5"/>
    <rect x="225" y="25" width="70" height="18" fill="#e5c07b" rx="2"/>
    <text x="260" y="38" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Detail: 1:25</text>
    <text x="325" y="38" fill="#98c379" font-family="sans-serif" font-size="12">🔒</text>

    <!-- Title Block area -->
    <rect x="220" y="160" width="120" height="70" fill="#e5c07b" fill-opacity="0.2" stroke="#e5c07b"/>
    <text x="280" y="195" fill="#333333" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Khung tên dự án</text>
  </g>

  <!-- Right: Control Instructions -->
  <g transform="translate(440, 90)">
    <rect width="270" height="250" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="135" y="28" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Quy trình điều khiển</text>

    <text x="20" y="65" fill="#e5c07b" font-family="sans-serif" font-size="11" font-weight="bold">1. Tạo khung nhìn (MVIEW / MV):</text>
    <text x="20" y="85" fill="#abb2bf" font-family="sans-serif" font-size="10">Gõ MV rồi quét 2 góc mở khung.</text>

    <text x="20" y="115" fill="#e5c07b" font-family="sans-serif" font-size="11" font-weight="bold">2. Chui vào trong (MSPACE / MS):</text>
    <text x="20" y="135" fill="#abb2bf" font-family="sans-serif" font-size="10">Nhấp đúp chuột vào giữa khung để xoay,</text>
    <text x="20" y="150" fill="#abb2bf" font-family="sans-serif" font-size="10">pan hình vẽ vào giữa màn hình.</text>

    <text x="20" y="180" fill="#e5c07b" font-family="sans-serif" font-size="11" font-weight="bold">3. Gán tỉ lệ &amp; Khóa (Lock):</text>
    <text x="20" y="200" fill="#abb2bf" font-family="sans-serif" font-size="10">Chọn tỉ lệ ở góc phải (1:100, 1:50...)</text>
    <text x="20" y="215" fill="#98c379" font-family="sans-serif" font-size="10">Bấm biểu tượng Ổ khóa để cố định tỉ lệ!</text>
    <text x="20" y="235" fill="#abb2bf" font-family="sans-serif" font-size="10">Gõ PS (PSPACE) để thoát ra ngoài giấy.</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Khóa khung nhìn (Display Lock) giúp không bao giờ bị mất tỉ lệ khi lăn bánh xe chuột</text>
</svg>
