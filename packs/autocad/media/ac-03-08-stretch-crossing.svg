<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Quy tắc vàng của lệnh STRETCH (Bắt buộc dùng Crossing Window)</text>

  <!-- Left: Original Shape with Crossing Box -->
  <g transform="translate(60, 80)">
    <rect width="280" height="300" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#61afef" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Bước 1: Quét Crossing (Phải sang Trái)</text>

    <!-- Part geometry (L-shaped bracket) -->
    <path d="M 40 200 L 40 100 L 120 100 L 120 160 L 220 160 L 220 200 Z" stroke="#61afef" stroke-width="2.5" fill="none"/>

    <!-- Crossing selection box covering only the right vertices -->
    <rect x="100" y="80" width="140" height="150" fill="#387a38" fill-opacity="0.3" stroke="#52b352" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="220" cy="160" r="5" fill="#e06c75"/>
    <circle cx="220" cy="200" r="5" fill="#e06c75"/>
    <circle cx="120" cy="160" r="5" fill="#e06c75"/>
    <text x="180" y="250" fill="#52b352" font-family="sans-serif" font-size="11" text-anchor="middle">Bao quanh các đỉnh</text>
    <text x="180" y="270" fill="#52b352" font-family="sans-serif" font-size="11" text-anchor="middle">cần kéo giãn</text>
  </g>

  <!-- Right: Stretched result -->
  <g transform="translate(400, 80)">
    <rect width="280" height="300" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#98c379" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Bước 2: Kéo giãn về bên phải</text>

    <!-- Stretched geometry -->
    <path d="M 40 200 L 40 100 L 120 100 L 120 160 L 260 160 L 260 200 Z" stroke="#98c379" stroke-width="2.5" fill="#387a38" fill-opacity="0.2"/>
    <line x1="220" y1="180" x2="260" y2="180" stroke="#e5c07b" stroke-width="2"/>
    <polygon points="260,180 250,175 250,185" fill="#e5c07b"/>
    <text x="240" y="165" fill="#e5c07b" font-family="sans-serif" font-size="11">+ 40mm</text>

    <text x="140" y="250" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Chiều dài tăng thêm 40mm</text>
    <text x="140" y="275" fill="#98c379" font-family="sans-serif" font-size="12" text-anchor="middle">Phần thân trái giữ nguyên vị trí</text>
  </g>
</svg>
