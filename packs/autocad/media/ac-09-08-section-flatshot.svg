<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Mặt phẳng cắt SECTIONPLANE và Trích xuất hình chiếu 2D FLATSHOT</text>

  <!-- Left: Section Plane -->
  <g transform="translate(60, 95)">
    <rect width="300" height="245" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="150" y="28" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Lệnh SECTIONPLANE</text>

    <!-- Cutting Plane cutting 3D shape -->
    <g transform="translate(150, 110)">
      <!-- 3D cylinder -->
      <ellipse cx="0" cy="40" rx="50" ry="20" fill="#282c34" stroke="#abb2bf"/>
      <ellipse cx="0" cy="-30" rx="50" ry="20" fill="#282c34" stroke="#abb2bf"/>
      <line x1="-50" y1="40" x2="-50" y2="-30" stroke="#abb2bf"/>
      <line x1="50" y1="40" x2="50" y2="-30" stroke="#abb2bf"/>

      <!-- Cutting plane transparent green -->
      <polygon points="-70,-10 70,-30 70,30 -70,50" fill="#98c379" fill-opacity="0.3" stroke="#98c379" stroke-width="2"/>
      <line x1="0" y1="20" x2="30" y2="40" stroke="#e5c07b" stroke-width="2"/>
      <polygon points="35,43 25,38 30,32" fill="#e5c07b"/>
      <text x="45" y="55" fill="#e5c07b" font-family="sans-serif" font-size="10" font-weight="bold">Hướng nhìn cắt</text>
    </g>

    <text x="150" y="195" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Cắt xuyên qua mô hình 3D trong thời gian thực</text>
    <text x="150" y="215" fill="#61afef" font-family="sans-serif" font-size="11" text-anchor="middle">Tự động sinh mặt cắt Hatch và đường bao 2D</text>
  </g>

  <!-- Right: FLATSHOT -->
  <g transform="translate(400, 95)">
    <rect width="300" height="245" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="150" y="28" fill="#98c379" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Lệnh FLATSHOT (Xuất 2D từ 3D)</text>

    <!-- Extracted 2D Block -->
    <g transform="translate(150, 110)">
      <rect x="-60" y="-35" width="120" height="70" fill="#282c34" stroke="#98c379" stroke-width="2"/>
      <circle cx="0" cy="0" r="18" fill="#14161a" stroke="#98c379" stroke-width="1.5"/>
      <!-- Hidden lines dashed -->
      <line x1="-40" y1="-35" x2="-40" y2="35" stroke="#e06c75" stroke-dasharray="3,2"/>
      <line x1="40" y1="-35" x2="40" y2="35" stroke="#e06c75" stroke-dasharray="3,2"/>
    </g>

    <text x="150" y="195" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">Chuyển góc nhìn 3D thành Block hình vẽ 2D</text>
    <text x="150" y="215" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Tách riêng nét thấy (Foreground) và nét khuất (Hidden)</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Dựng hình 3D một lần $\to$ FLATSHOT trích xuất toàn bộ hình chiếu đứng, hình chiếu bằng và trục đo 2D</text>
</svg>
