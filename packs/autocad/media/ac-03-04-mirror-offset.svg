<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Left: MIRROR Operation -->
  <g transform="translate(60, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#61afef" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh MIRROR (Đối xứng)</text>

    <!-- Mirror axis -->
    <line x1="140" y1="60" x2="140" y2="250" stroke="#e06c75" stroke-width="2" stroke-dasharray="8,4,2,4"/>
    <circle cx="140" cy="80" r="4" fill="#e06c75"/>
    <circle cx="140" cy="230" r="4" fill="#e06c75"/>
    <text x="140" y="270" fill="#e06c75" font-family="sans-serif" font-size="11" text-anchor="middle">Trục đối xứng (Mirror Line)</text>

    <!-- Source shape (Left) -->
    <path d="M 50 100 L 110 100 L 110 170 L 70 170 L 50 140 Z" stroke="#61afef" stroke-width="2.5" fill="#2d5e8a" fill-opacity="0.3"/>
    <text x="75" y="195" fill="#61afef" font-family="sans-serif" font-size="11" text-anchor="middle">Hình gốc</text>

    <!-- Mirrored shape (Right) -->
    <path d="M 230 100 L 170 100 L 170 170 L 210 170 L 230 140 Z" stroke="#98c379" stroke-width="2.5" fill="#387a38" fill-opacity="0.3"/>
    <text x="205" y="195" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">Bản sao lật ngược</text>

    <text x="140" y="300" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Erase source objects? [Yes/No]</text>
  </g>

  <!-- Right: OFFSET Operation -->
  <g transform="translate(400, 50)">
    <rect width="280" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="140" y="30" fill="#98c379" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Lệnh OFFSET (Song song)</text>

    <!-- Original concentric circle / polyline -->
    <path d="M 50 200 L 110 100 L 220 100" stroke="#abb2bf" stroke-width="2.5" fill="none"/>
    <text x="110" y="80" fill="#abb2bf" font-family="sans-serif" font-size="11">Đường gốc</text>

    <!-- Offset shape -->
    <path d="M 50 230 L 125 130 L 220 130" stroke="#98c379" stroke-width="2.5" fill="none"/>
    <text x="170" y="150" fill="#98c379" font-family="sans-serif" font-size="11">Offset d = 30</text>

    <!-- Dimension arrow between them -->
    <line x1="160" y1="100" x2="160" y2="130" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="175" y="118" fill="#e5c07b" font-family="sans-serif" font-size="11">Khoảng cách d</text>

    <circle cx="140" cy="220" r="30" stroke="#abb2bf" stroke-width="2" fill="none"/>
    <circle cx="140" cy="220" r="45" stroke="#98c379" stroke-width="2" fill="none"/>
    <text x="140" y="300" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">Tạo đường tròn đồng tâm tức thì</text>
  </g>
</svg>
