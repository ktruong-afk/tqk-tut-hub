<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <rect width="700" height="450" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="660" height="410" fill="#111215" stroke="#323640" stroke-width="1.5" rx="6"/>
  
  <!-- ViewCube at Top Right -->
  <g transform="translate(480, 50)">
    <rect width="160" height="160" fill="#252932" stroke="#485060" stroke-width="2" rx="4"/>
    <text x="80" y="90" fill="#4fa3d1" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">TOP</text>
    <rect x="10" y="10" width="140" height="20" fill="#363c49" rx="2"/>
    <text x="80" y="24" fill="#cfd6e6" font-family="sans-serif" font-size="11" text-anchor="middle">WCS / Bắc (N)</text>
    <circle cx="80" cy="140" r="12" fill="#3a404e"/>
    <text x="80" y="144" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">↻</text>
  </g>

  <!-- Navigation Bar (Vertical on right edge) -->
  <g transform="translate(620, 230)">
    <rect width="36" height="180" fill="#252932" stroke="#485060" stroke-width="1.5" rx="4"/>
    <!-- Pan button -->
    <rect x="4" y="8" width="28" height="36" fill="#353b47" rx="3"/>
    <text x="18" y="32" fill="#e5c07b" font-family="sans-serif" font-size="18" text-anchor="middle">✋</text>
    <!-- Zoom Extents button -->
    <rect x="4" y="52" width="28" height="36" fill="#353b47" rx="3"/>
    <text x="18" y="76" fill="#61afef" font-family="sans-serif" font-size="18" text-anchor="middle">🔍</text>
    <!-- Orbit 3D button -->
    <rect x="4" y="96" width="28" height="36" fill="#353b47" rx="3"/>
    <text x="18" y="120" fill="#98c379" font-family="sans-serif" font-size="18" text-anchor="middle">⟳</text>
    <!-- Rewind button -->
    <rect x="4" y="140" width="28" height="32" fill="#353b47" rx="3"/>
    <text x="18" y="162" fill="#abb2bf" font-family="sans-serif" font-size="16" text-anchor="middle">⏪</text>
  </g>

  <!-- Canvas Objects to navigate around -->
  <g stroke="#61afef" stroke-width="2" fill="none">
    <rect x="80" y="100" width="220" height="140" stroke="#98c379"/>
    <circle cx="190" cy="170" r="45" stroke="#e5c07b"/>
    <line x1="80" y1="100" x2="300" y2="240" stroke="#e06c75"/>
  </g>

  <!-- Mouse Middle Button hint -->
  <g transform="translate(80, 280)">
    <rect width="320" height="120" fill="#21252b" stroke="#3e4451" stroke-width="1" rx="5"/>
    <text x="20" y="30" fill="#e5c07b" font-family="sans-serif" font-size="14" font-weight="bold">Điều hướng bằng chuột giữa:</text>
    <text x="20" y="55" fill="#abb2bf" font-family="sans-serif" font-size="12">• Lăn bánh xe chuột: Phóng to (Zoom In) / Thu nhỏ (Zoom Out)</text>
    <text x="20" y="80" fill="#abb2bf" font-family="sans-serif" font-size="12">• Đè giữ bánh xe chuột: Rê trượt bản vẽ (Pan)</text>
    <text x="20" y="105" fill="#abb2bf" font-family="sans-serif" font-size="12">• Nhấp đúp chuột giữa: Zoom vừa khít toàn bộ (Zoom Extents)</text>
  </g>
</svg>
