<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#21252b" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="40" y="50" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Dimension Style Manager (Hộp thoại quản lý kiểu kích thước)</text>

  <!-- Left: Styles List -->
  <g transform="translate(40, 70)">
    <rect width="180" height="280" fill="#181a1f" stroke="#323640" stroke-width="1" rx="4"/>
    <text x="15" y="25" fill="#abb2bf" font-family="sans-serif" font-size="12" font-weight="bold">Styles (Kiểu có sẵn):</text>
    <rect x="10" y="35" width="160" height="26" fill="#2d5e8a" rx="2"/>
    <text x="20" y="52" fill="#ffffff" font-family="sans-serif" font-size="12">ISO-25 (Hiện hành)</text>
    <text x="20" y="80" fill="#abb2bf" font-family="sans-serif" font-size="12">Standard</text>
    <text x="20" y="105" fill="#abb2bf" font-family="sans-serif" font-size="12">Annotative</text>

    <!-- Buttons -->
    <rect x="10" y="160" width="160" height="26" fill="#353b45" rx="2"/>
    <text x="50" y="177" fill="#ffffff" font-family="sans-serif" font-size="11">Set Current</text>
    <rect x="10" y="195" width="160" height="26" fill="#353b45" rx="2"/>
    <text x="65" y="212" fill="#98c379" font-family="sans-serif" font-size="11">+ New...</text>
    <rect x="10" y="230" width="160" height="26" fill="#353b45" rx="2"/>
    <text x="58" y="247" fill="#61afef" font-family="sans-serif" font-size="11">✎ Modify...</text>
  </g>

  <!-- Right: Tab structure of Modify Dimension Style -->
  <g transform="translate(240, 70)">
    <rect width="460" height="320" fill="#181a1f" stroke="#323640" stroke-width="1" rx="4"/>
    
    <!-- Tab headers -->
    <g font-family="sans-serif" font-size="11" fill="#abb2bf">
      <rect x="10" y="10" width="55" height="24" fill="#282c34" rx="2"/>
      <text x="18" y="26">Lines</text>
      <rect x="70" y="10" width="70" height="24" fill="#282c34" rx="2"/>
      <text x="76" y="26">Symbols</text>
      <rect x="145" y="10" width="50" height="24" fill="#282c34" rx="2"/>
      <text x="154" y="26">Text</text>
      <rect x="200" y="10" width="45" height="24" fill="#282c34" rx="2"/>
      <text x="210" y="26">Fit</text>
      <rect x="250" y="10" width="90" height="24" fill="#2d5e8a" rx="2"/>
      <text x="258" y="26" fill="#ffffff" font-weight="bold">Primary Units</text>
      <rect x="345" y="10" width="70" height="24" fill="#282c34" rx="2"/>
      <text x="352" y="26">Tolerances</text>
    </g>

    <!-- Tab content preview (Primary Units & Text) -->
    <g transform="translate(20, 50)" font-family="sans-serif" font-size="12" fill="#abb2bf">
      <text x="10" y="30" fill="#ffffff" font-weight="bold">Linear dimensions (Quy cách số đo):</text>
      <text x="20" y="60">Unit format:</text>
      <text x="140" y="60" fill="#61afef">Decimal (Thập phân)</text>
      <text x="20" y="90">Precision:</text>
      <text x="140" y="90" fill="#61afef">0.00 (2 số thập phân)</text>
      <text x="20" y="120">Decimal separator:</text>
      <text x="140" y="120" fill="#61afef">'.' (Period - Dấu chấm)</text>

      <line x1="10" y1="145" x2="410" y2="145" stroke="#323640" stroke-width="1"/>
      <text x="10" y="175" fill="#ffffff" font-weight="bold">Zero suppression (Khử số 0 thừa):</text>
      <text x="20" y="200">Trailing:</text>
      <text x="140" y="200" fill="#98c379">✔ Bật (10.00 tự rút gọn thành 10)</text>

      <!-- Dimension graphic preview -->
      <g transform="translate(240, 60)">
        <line x1="20" y1="50" x2="140" y2="50" stroke="#e5c07b" stroke-width="1.5"/>
        <line x1="20" y1="40" x2="20" y2="60" stroke="#e5c07b" stroke-width="1"/>
        <line x1="140" y1="40" x2="140" y2="60" stroke="#e5c07b" stroke-width="1"/>
        <text x="80" y="45" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">50.00</text>
      </g>
    </g>
  </g>
</svg>
