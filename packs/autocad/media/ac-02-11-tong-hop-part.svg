<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" height="100%">
  <defs>
    <pattern id="hatch-tonghop" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#61afef" stroke-width="1.2" />
    </pattern>
  </defs>

  <rect width="760" height="460" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="420" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Bản vẽ chi tiết mặt bích cơ khí 2D (Bài tổng hợp)</text>

  <!-- Part Geometry -->
  <!-- Outer flange circle -->
  <circle cx="380" cy="240" r="140" stroke="#98c379" stroke-width="3" fill="url(#hatch-tonghop)"/>
  
  <!-- Bolt hole pitch circle (Center line) -->
  <circle cx="380" cy="240" r="105" stroke="#e06c75" stroke-width="1.5" stroke-dasharray="8,4,2,4" fill="none"/>
  
  <!-- 4 Bolt holes -->
  <circle cx="380" cy="135" r="14" stroke="#ffffff" stroke-width="2" fill="#14161a"/>
  <circle cx="380" cy="345" r="14" stroke="#ffffff" stroke-width="2" fill="#14161a"/>
  <circle cx="275" cy="240" r="14" stroke="#ffffff" stroke-width="2" fill="#14161a"/>
  <circle cx="485" cy="240" r="14" stroke="#ffffff" stroke-width="2" fill="#14161a"/>

  <!-- Inner shaft hole with keyway (Rãnh then) -->
  <circle cx="380" cy="240" r="45" stroke="#ffffff" stroke-width="2.5" fill="#14161a"/>
  <rect x="372" y="185" width="16" height="20" stroke="#ffffff" stroke-width="2" fill="#14161a"/>

  <!-- Center mark -->
  <line x1="380" y1="70" x2="380" y2="410" stroke="#e06c75" stroke-width="1" stroke-dasharray="10,4,2,4"/>
  <line x1="210" y1="240" x2="550" y2="240" stroke="#e06c75" stroke-width="1" stroke-dasharray="10,4,2,4"/>

  <!-- Annotations / Dimensions preview -->
  <text x="130" y="245" fill="#abb2bf" font-family="monospace" font-size="12">Ø280 (Viền ngoài)</text>
  <text x="560" y="245" fill="#abb2bf" font-family="monospace" font-size="12">4 Lỗ Ø28 đối xứng</text>
  <text x="380" y="425" fill="#61afef" font-family="sans-serif" font-size="12" text-anchor="middle">Kết hợp: LINE, CIRCLE, RECTANG, HATCH, ARRAY, OSNAP</text>
</svg>
