<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Tổng hợp dựng hình 3D Solid: Gối đỡ trục cơ khí có lỗ khoét và bo vát</text>

  <!-- Central Isometric 3D Model -->
  <g transform="translate(380, 205)">
    <!-- Base Plate 3D -->
    <polygon points="-160,40 0,-30 160,40 0,110" fill="#282c34" stroke="#61afef" stroke-width="1.5"/>
    <polygon points="-160,40 0,110 0,135 -160,65" fill="#21252b" stroke="#61afef" stroke-width="1.5"/>
    <polygon points="0,110 160,40 160,65 0,135" fill="#181a1f" stroke="#61afef" stroke-width="1.5"/>

    <!-- Left bolt hole -->
    <ellipse cx="-100" cy="55" rx="14" ry="7" fill="#14161a" stroke="#e06c75" stroke-width="1.5"/>
    <!-- Right bolt hole -->
    <ellipse cx="100" cy="55" rx="14" ry="7" fill="#14161a" stroke="#e06c75" stroke-width="1.5"/>

    <!-- Center Boss / Bearing Upright -->
    <g transform="translate(0, -20)">
      <!-- Cylinder top -->
      <ellipse cx="0" cy="-60" rx="55" ry="25" fill="#3e4451" stroke="#98c379" stroke-width="2"/>
      <!-- Cylinder center hole (bore) -->
      <ellipse cx="0" cy="-60" rx="30" ry="14" fill="#14161a" stroke="#e5c07b" stroke-width="2"/>
      <!-- Body cylinder -->
      <path d="M -55,-60 L -55,30 A 55 25 0 0 0 55,30 L 55,-60 Z" fill="#2c313a" fill-opacity="0.8" stroke="#98c379" stroke-width="1.5"/>
    </g>

    <!-- Fillet annotations -->
    <path d="M -160,40 Q -150,55 -135,52" stroke="#e5c07b" stroke-width="1.5" fill="none"/>
    <text x="-195" y="45" fill="#e5c07b" font-family="sans-serif" font-size="11" font-weight="bold">Bo tròn R10 (FILLETEDGE)</text>

    <!-- Center hole annotation -->
    <line x1="0" y1="-80" x2="60" y2="-110" stroke="#e5c07b" stroke-width="1.5"/>
    <text x="65" y="-115" fill="#e5c07b" font-family="sans-serif" font-size="11" font-weight="bold">Lỗ trục Ø50 (SUBTRACT)</text>
  </g>

  <!-- Process summary boxes below -->
  <g transform="translate(60, 335)">
    <rect width="180" height="55" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="90" y="24" fill="#61afef" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. Dựng khối đế &amp; gối trụ</text>
    <text x="90" y="42" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">BOX + CYLINDER</text>
  </g>

  <g transform="translate(290, 335)">
    <rect width="180" height="55" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="90" y="24" fill="#e5c07b" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. Boolean &amp; Khoét lỗ</text>
    <text x="90" y="42" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">UNION + SUBTRACT</text>
  </g>

  <g transform="translate(520, 335)">
    <rect width="180" height="55" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="90" y="24" fill="#98c379" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. Gia công cạnh mép</text>
    <text x="90" y="42" fill="#abb2bf" font-family="sans-serif" font-size="10" text-anchor="middle">FILLETEDGE + CHAMFEREDGE</text>
  </g>
</svg>
