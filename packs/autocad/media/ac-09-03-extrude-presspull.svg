<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <text x="380" y="55" fill="#e5c07b" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">So sánh phương pháp tạo khối 3D: EXTRUDE vs PRESSPULL</text>

  <!-- Left: EXTRUDE -->
  <g transform="translate(60, 95)">
    <rect width="300" height="245" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="150" y="28" fill="#61afef" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Lệnh EXTRUDE (EXT)</text>

    <!-- Isometric Cylinder Extrude -->
    <g transform="translate(150, 110)">
      <!-- Base circle -->
      <ellipse cx="0" cy="50" rx="60" ry="25" fill="#282c34" stroke="#61afef" stroke-width="1.5"/>
      <!-- Top circle -->
      <ellipse cx="0" cy="-30" rx="60" ry="25" fill="#61afef" fill-opacity="0.3" stroke="#61afef" stroke-width="2"/>
      <!-- Sides -->
      <line x1="-60" y1="50" x2="-60" y2="-30" stroke="#61afef" stroke-width="2"/>
      <line x1="60" y1="50" x2="60" y2="-30" stroke="#61afef" stroke-width="2"/>

      <!-- Up arrow -->
      <line x1="0" y1="30" x2="0" y2="-10" stroke="#e5c07b" stroke-width="2"/>
      <polygon points="0,-18 -4,-8 4,-8" fill="#e5c07b"/>
      <text x="25" y="10" fill="#e5c07b" font-family="sans-serif" font-size="11" font-weight="bold">Cao 80mm</text>
    </g>

    <text x="150" y="195" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">• Yêu cầu biên dạng phải là Polyline khép kín</text>
    <text x="150" y="215" fill="#abb2bf" font-family="sans-serif" font-size="11" text-anchor="middle">• Nếu nét hở $\to$ Tạo thành mặt mỏng Surface</text>
  </g>

  <!-- Right: PRESSPULL -->
  <g transform="translate(400, 95)">
    <rect width="300" height="245" fill="#1e222b" stroke="#323640" rx="4"/>
    <text x="150" y="28" fill="#98c379" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Lệnh PRESSPULL (Ấn / Kéo trực quan)</text>

    <!-- Block with hole presspulled -->
    <g transform="translate(150, 105)">
      <!-- Main box isometric -->
      <polygon points="-70,20 0,-15 70,20 0,55" fill="#282c34" stroke="#abb2bf" stroke-width="1.5"/>
      <polygon points="-70,20 0,55 0,95 -70,60" fill="#21252b" stroke="#abb2bf" stroke-width="1.5"/>
      <polygon points="0,55 70,20 70,60 0,95" fill="#181a1f" stroke="#abb2bf" stroke-width="1.5"/>

      <!-- Hole pressed down -->
      <ellipse cx="0" cy="20" rx="25" ry="12" fill="#14161a" stroke="#98c379" stroke-width="2"/>
      <line x1="0" y1="20" x2="0" y2="45" stroke="#e06c75" stroke-width="2"/>
      <polygon points="0,52 -3,43 3,43" fill="#e06c75"/>
      <text x="35" y="40" fill="#e06c75" font-family="sans-serif" font-size="10" font-weight="bold">Ấn xuống = Khoét lỗ</text>
    </g>

    <text x="150" y="195" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">• Tự nhận diện vùng khép kín (như HATCH)</text>
    <text x="150" y="215" fill="#98c379" font-family="sans-serif" font-size="11" text-anchor="middle">• Đùn lên = Thêm thịt; Đùn xuống = Khoét lỗ</text>
  </g>

  <text x="380" y="390" fill="#abb2bf" font-family="sans-serif" font-size="12" text-anchor="middle">PRESSPULL là công cụ tạo và khoét khối 3D tiện lợi, nhanh nhất trong AutoCAD hiện đại</text>
</svg>
