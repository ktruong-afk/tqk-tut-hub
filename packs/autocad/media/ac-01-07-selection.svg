<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" height="100%">
  <rect width="760" height="440" fill="#1b1d22" rx="8"/>
  <rect x="20" y="20" width="720" height="400" fill="#14161a" stroke="#323640" stroke-width="1.5" rx="6"/>

  <!-- Left: Window Selection (Trái sang phải - Xanh dương viền liền) -->
  <g transform="translate(40, 50)">
    <rect width="320" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="160" y="30" fill="#61afef" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Window Selection (Trái → Phải)</text>
    
    <!-- Geometric shapes -->
    <rect x="40" y="80" width="80" height="60" fill="none" stroke="#e5c07b" stroke-width="2"/>
    <circle cx="220" cy="110" r="35" fill="none" stroke="#e06c75" stroke-width="2"/>
    <line x1="60" y1="200" x2="260" y2="280" stroke="#abb2bf" stroke-width="2"/>

    <!-- Selection box: Blue fill, solid blue border -->
    <rect x="25" y="65" width="115" height="100" fill="#2d5e8a" fill-opacity="0.3" stroke="#4fa3d1" stroke-width="2"/>
    <circle cx="25" cy="65" r="4" fill="#ffffff"/>
    <text x="32" y="60" fill="#ffffff" font-family="sans-serif" font-size="10">Điểm 1 (Click)</text>
    <circle cx="140" cy="165" r="4" fill="#ffffff"/>
    <text x="145" y="175" fill="#ffffff" font-family="sans-serif" font-size="10">Điểm 2 (Click)</text>
    <text x="160" y="305" fill="#98c379" font-family="sans-serif" font-size="12" text-anchor="middle">Chỉ chọn vật nằm TRỌN VẸN bên trong</text>
  </g>

  <!-- Right: Crossing Selection (Phải sang trái - Xanh lá viền đứt) -->
  <g transform="translate(400, 50)">
    <rect width="320" height="320" fill="#1e222b" stroke="#2d3340" stroke-width="1" rx="4"/>
    <text x="160" y="30" fill="#98c379" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Crossing Selection (Phải → Trái)</text>
    
    <!-- Geometric shapes -->
    <rect x="40" y="80" width="80" height="60" fill="none" stroke="#e5c07b" stroke-width="2"/>
    <circle cx="220" cy="110" r="35" fill="none" stroke="#e06c75" stroke-width="2"/>
    <line x1="60" y1="200" x2="260" y2="280" stroke="#abb2bf" stroke-width="2"/>

    <!-- Crossing box: Green fill, dashed green border -->
    <rect x="140" y="70" width="140" height="180" fill="#387a38" fill-opacity="0.3" stroke="#52b352" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="280" cy="70" r="4" fill="#ffffff"/>
    <text x="220" y="62" fill="#ffffff" font-family="sans-serif" font-size="10">Điểm 1 (Click)</text>
    <circle cx="140" cy="250" r="4" fill="#ffffff"/>
    <text x="75" y="260" fill="#ffffff" font-family="sans-serif" font-size="10">Điểm 2 (Click)</text>
    <text x="160" y="305" fill="#e5c07b" font-family="sans-serif" font-size="12" text-anchor="middle">Chọn vật bên trong VÀ vật bị CẮT QUA</text>
  </g>
</svg>
